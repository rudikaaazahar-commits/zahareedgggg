<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Зберіть Україну — аркада</title>
  <meta name="theme-color" content="#08182d">
  <style>
    :root{--blue:#1f63a8;--yellow:#ffd83d;--ink:#071426;--cream:#fff8df}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(#11264a 0 66%,#d9b56d 66%);color:white;overflow:hidden;user-select:none}.sky{position:absolute;inset:0;overflow:hidden}.sun{position:absolute;width:110px;height:110px;border-radius:50%;background:var(--yellow);right:9%;top:11%;box-shadow:0 0 40px #ffd83d55}.cloud{position:absolute;height:23px;width:110px;border-radius:30px;background:#ffffff30}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:46px;height:46px;left:18px;bottom:0}.cloud:after{width:55px;height:55px;right:13px;bottom:0}.c1{top:15%;left:-120px;animation:drift 19s linear infinite}.c2{top:29%;left:-180px;animation:drift 27s linear infinite 5s}@keyframes drift{to{transform:translateX(calc(100vw + 300px))}}.ui{position:fixed;z-index:5;left:18px;right:18px;top:16px;display:flex;justify-content:center}.stats{display:flex;gap:8px}.stat{min-width:112px;text-align:center;padding:8px 14px;border:2px solid #ffffff55;border-radius:14px;background:#071426b8;backdrop-filter:blur(8px)}.stat small{display:block;text-transform:uppercase;font-size:9px;letter-spacing:.18em;color:#bfcbe0}.stat strong{font-size:21px}.game{position:fixed;z-index:3;inset:0}.player{position:absolute;width:76px;height:76px;left:calc(50% - 38px);bottom:85px;filter:drop-shadow(0 10px 8px #07142655);transition:transform .08s}.player svg{width:100%;height:100%}.item{position:absolute;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;font-size:29px;filter:drop-shadow(0 7px 6px #07142666)}.item.good{background:var(--yellow);border:3px solid white}.item.bad{background:#eb5757;border:3px solid #fff0ed}.ground{position:absolute;z-index:2;left:0;right:0;bottom:0;height:68px;background:linear-gradient(135deg,#6e9c54 25%,#86b963 25% 50%,#6e9c54 50% 75%,#86b963 75%);background-size:42px 42px;border-top:7px solid #bce58a}.overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:20px;background:#071426bb;backdrop-filter:blur(12px)}.overlay.hidden{display:none}.card{width:min(520px,100%);text-align:center;border:1px solid #ffffff33;border-radius:28px;padding:38px 28px;background:linear-gradient(145deg,#17396e,#0a1b38);box-shadow:0 25px 70px #0008}.coat{font-size:64px;line-height:1;margin-bottom:12px}.card h1{margin:8px 0;font-size:clamp(38px,10vw,67px);line-height:.95;letter-spacing:-.06em}.card h1 span{color:var(--yellow)}.card p{color:#bfcbe0;margin:14px auto 24px;max-width:380px}.card button{border:0;border-radius:999px;background:var(--yellow);color:var(--ink);font-size:17px;font-weight:900;padding:16px 27px;cursor:pointer;box-shadow:0 9px 0 #ad8c22}.card button:active{transform:translateY(5px);box-shadow:0 4px 0 #ad8c22}.controls{position:fixed;z-index:6;left:16px;right:16px;bottom:82px;display:none;justify-content:space-between;pointer-events:none}.controls button{width:70px;height:70px;border-radius:50%;border:2px solid #ffffff77;background:#07142688;color:white;font-size:28px;pointer-events:auto;touch-action:none}.best{margin-top:20px;font-size:13px;color:#aebbd0}.flash{position:absolute;inset:0;z-index:4;pointer-events:none}.flash.hit{animation:flash .18s}@keyframes flash{50%{background:#ffdc3d55}}@media(max-width:760px),(pointer:coarse){.controls{display:flex}.sun{width:78px;height:78px}.stat{min-width:92px;padding:7px 8px}.stats{gap:5px}.ui{left:8px;right:8px}.player{bottom:150px}.ground{height:65px}}
  </style>
</head>
<body>
  <div class="sky"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div></div>
  <div class="ui"><div class="stats"><div class="stat"><small>Рахунок</small><strong id="score">0</strong></div><div class="stat"><small>Життя</small><strong id="life">❤️❤️❤️</strong></div><div class="stat"><small>Час</small><strong id="time">45</strong></div></div></div>
  <div class="game" id="game"><div class="flash" id="flash"></div><div class="player" id="player"><svg viewBox="0 0 100 100"><path d="M50 5 58 35 92 33 64 51 76 84 50 64 24 84 36 51 8 33 42 35Z" fill="#ffd83d" stroke="#fff" stroke-width="4"/><circle cx="50" cy="50" r="18" fill="#2674bd"/><path d="M33 49h34v20H33z" fill="#2674bd"/><path d="M33 49h34v10H33z" fill="#ffd83d"/></svg></div></div>
  <div class="ground"></div>
  <div class="controls"><button id="left" aria-label="Вліво">←</button><button id="right" aria-label="Вправо">→</button></div>
  <div class="overlay" id="overlay"><div class="card"><div class="coat">🇺🇦</div><div class="eyebrow">АРКАДНА ГРА</div><h1>ЗБЕРИ <span>УКРАЇНУ!</span></h1><p>Лови жовті зірки та обережно обминай тіні. У тебе 45 секунд і три серця.</p><button id="start">ПОЧАТИ ГРУ</button><div class="best">Рекорд: <strong id="best">0</strong></div></div></div>
<script>
(()=>{const game=document.getElementById('game'),player=document.getElementById('player'),scoreEl=document.getElementById('score'),lifeEl=document.getElementById('life'),timeEl=document.getElementById('time'),overlay=document.getElementById('overlay'),flash=document.getElementById('flash'),bestEl=document.getElementById('best');let x=innerWidth/2,y=0,score=0,lives=3,time=45,running=false,items=[],keys={},last=0,spawn=0,best=Number(localStorage.getItem('ukraineGameBest')||0);bestEl.textContent=best;
function reset(){x=innerWidth/2;y=innerHeight-(innerWidth<=760?150:85)-76;score=0;lives=3;time=45;items.forEach(i=>i.el.remove());items=[];update();player.style.left=(x-38)+'px';player.style.top=y+'px'}
function update(){scoreEl.textContent=score;lifeEl.textContent='❤️'.repeat(lives)+'<3'.repeat(Math.max(0,0)).replace(/<3/g,'');lifeEl.textContent='❤️'.repeat(lives)+'♡'.repeat(3-lives);timeEl.textContent=time}
function start(){reset();overlay.classList.add('hidden');running=true;last=performance.now();requestAnimationFrame(loop)}
function spawnItem(){const bad=Math.random()<.28;const el=document.createElement('div');el.className='item '+(bad?'bad':'good');el.textContent=bad?'☁️':'★';game.appendChild(el);const sx=35+Math.random*(innerWidth-70);items.push({el,x:sx,y:-55,vy:170+Math.random()*130+score*.8,bad});el.style.left=sx+'px';el.style.top='-55px'}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.035);last=now;if(keys.ArrowLeft||keys.a)x-=310*dt;if(keys.ArrowRight||keys.d)x+=310*dt;x=Math.max(38,Math.min(innerWidth-38,x));player.style.left=(x-38)+'px';player.style.top=y+'px';player.style.transform=keys.ArrowLeft||keys.a?'rotate(-7deg)':keys.ArrowRight||keys.d?'rotate(7deg)':'none';spawn-=dt;if(spawn<=0){spawnItem();spawn=Math.max(.38,1.05-score*.012)};for(let n=items.length-1;n>=0;n--){const i=items[n];i.y+=i.vy*dt;i.el.style.top=i.y+'px';const dx=i.x-x,dy=i.y-(y+38);if(Math.abs(dx)<55&&Math.abs(dy)<58){if(i.bad){lives--;flash.classList.add('hit');setTimeout(()=>flash.classList.remove('hit'),180)}else score+=10;update();i.el.remove();items.splice(n,1)}else if(i.y>innerHeight){i.el.remove();items.splice(n,1)}}requestAnimationFrame(loop)}
let timer=setInterval(()=>{if(!running)return;time--;update();if(time<=0)end()},1000);
function end(){running=false;items.forEach(i=>i.el.remove());items=[];if(score>best){best=score;localStorage.setItem('ukraineGameBest',best)}bestEl.textContent=best;overlay.queryContent;overlay.querySelector('h1').innerHTML='РЕЗУЛЬТАТ: <span>'+score+'</span>';overlay.querySelector('p').textContent=time<=0?'Час вийшов! Ти чудово зібрав Україну. Спробуй побити рекорд!':'Серця закінчилися, але попереду нова спроба!';document.getElementById('start').textContent='ГРАТИ ЩЕ';overlay.classList.remove('hidden')}
function bindKey(code,on){addEventListener(code==='left'?'keydown':'keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLower?e.key.toLowerCase()==='a':false)keys.a=on})}addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);const left=document.getElementById('left'),right=document.getElementById('right');function hold(el,dir,on){el.addEventListener(on?'pointerdown':'pointerup',()=>keys[dir]=on);el.addEventListener('pointerleave',()=>keys[dir]=false)}hold(left,'ArrowLeft',true);hold(left,'ArrowLeft',false);hold(right,'ArrowRight',true);hold(right,'ArrowRight',false);document.getElementById('start').addEventListener('click',start);addEventListener('resize',()=>{x=Math.max(38,Math.min(innerWidth-38,x));y=innerHeight-(innerWidth<=760?150:85)-76});reset();})();
</script>
</body>
</html>
